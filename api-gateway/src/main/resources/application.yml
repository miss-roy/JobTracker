server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Forward every /api/** request to job-service.
        # lb:// means "load-balanced via the service registry" (Eureka),
        # so we never hard-code job-service's host/port.
        - id: job-service
          uri: lb://job-service
          predicates:
            - Path=/api/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
