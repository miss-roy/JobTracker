server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Forward every /api/** request to job-service.
        # lb:// = load-balanced via the service registry (Eureka), so when there
        # are multiple job-service instances the gateway round-robins across them.
        - id: job-service
          uri: lb://job-service
          predicates:
            - Path=/api/**
          filters:
            # Wrap the downstream call in a circuit breaker. If job-service is
            # down/slow/erroring past the threshold, the breaker opens and
            # returns the fallback instead of hanging or cascading the failure.
            - name: CircuitBreaker
              args:
                name: jobServiceCB
                fallbackUri: forward:/fallback/jobs

# Circuit-breaker + time-limiter tuning for the "jobServiceCB" instance above.
resilience4j:
  circuitbreaker:
    instances:
      jobServiceCB:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10                 # look at the last 10 calls
        minimum-number-of-calls: 5              # don't evaluate the rate until 5 calls seen
        failure-rate-threshold: 50              # open if >=50% of them failed
        wait-duration-in-open-state: 10s        # stay open 10s, then test again
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    instances:
      jobServiceCB:
        timeout-duration: 4s                    # a call slower than 4s counts as a failure

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
    # Unique id per instance so multiple gateway replicas register distinctly.
    instance-id: ${spring.application.name}:${random.value}
