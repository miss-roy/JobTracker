# Bring up the whole system:                docker compose up -d --build
# Bring it up scaled (the interview demo):
#   docker compose up -d --build --scale job-service=3 --scale api-gateway=2
#
# Scaled services (job-service, api-gateway) intentionally have NO
# container_name and NO host port mapping, because those would conflict when
# running multiple replicas. They are reached through the edge LB / gateway.
services:
  postgres:
    image: postgres:16
    container_name: postgres            # singleton (stateful) -> fixed name is fine
    environment:
      POSTGRES_DB: jobtracker
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: jobtracker
    ports:
      - "5433:5432"
    volumes:
      - jobdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker -d jobtracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  discovery-server:
    build: ./discovery-server
    container_name: discovery-server    # singleton (registry) -> fixed name is fine
    ports:
      - "8761:8761"                     # Eureka dashboard: http://localhost:8761

  job-service:
    build: ./job-service
    # No container_name / no host port -> scalable: `--scale job-service=N`
    environment:
      EUREKA_URI: http://discovery-server:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jobtracker
      SPRING_DATASOURCE_USERNAME: jobtracker
      SPRING_DATASOURCE_PASSWORD: jobtracker
    depends_on:
      discovery-server:
        condition: service_started
      postgres:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    # No container_name / no host port -> scalable: `--scale api-gateway=N`
    environment:
      EUREKA_URI: http://discovery-server:8761/eureka
    depends_on:
      - discovery-server
      - job-service

  edge:
    image: nginx:alpine
    container_name: edge
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"                       # THE single public entry point for clients
    depends_on:
      - api-gateway

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:80"                       # open the app at http://localhost:3000
    depends_on:
      - edge

# Named volume: keeps Postgres data across `down`/`up` (use `down -v` to wipe).
volumes:
  jobdata:
