server {
    listen 80;
    server_name _;

    # Serve the built React app.
    root /usr/share/nginx/html;
    index index.html;

    # Forward API calls to the edge load balancer, which round-robins across
    # the api-gateway replicas (which in turn load-balance across job-service).
    location /api/ {
        proxy_pass http://edge:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback: any unknown path returns index.html so client routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
