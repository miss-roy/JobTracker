worker_processes auto;
events { worker_connections 1024; }

http {
    # Docker's embedded DNS server. Because api-gateway is a scaled service,
    # this name resolves to ALL gateway replica IPs; Docker rotates the order
    # (round-robin DNS). valid=1s keeps nginx re-resolving frequently so traffic
    # spreads across replicas as they come and go.
    resolver 127.0.0.11 valid=1s ipv6=off;

    server {
        listen 80;

        location / {
            # Using a variable in proxy_pass forces nginx to resolve the name at
            # request time (via the resolver above) instead of caching one IP at
            # startup. This is what makes the edge LB pick up scaled replicas.
            set $gateway api-gateway;
            proxy_pass http://$gateway:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
        }
    }
}
