# Test profile: fast, infra-free. Uses H2 with a Hibernate-generated schema
# instead of Postgres + Flyway, so `mvn test` needs no running database.
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  seed-sample-data: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
